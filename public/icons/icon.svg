<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Brand orange, full-bleed. No rounded corners on purpose: Chrome paints
       a white tile behind extension icons, so any transparent corner would
       show through as a white frame. We leave any rounding to Chrome's UI. -->
  <rect width="128" height="128" fill="#d97757"/>
  <!-- Side-panel indicator: a vertical pill on the left -->
  <rect x="28" y="32" width="8" height="64" rx="4" fill="#fff"/>
  <!-- Three tab rows stacked to the right -->
  <rect x="48" y="36" width="56" height="8" rx="4" fill="#fff"/>
  <rect x="48" y="60" width="56" height="8" rx="4" fill="#fff"/>
  <rect x="48" y="84" width="36" height="8" rx="4" fill="#fff" opacity="0.72"/>
</svg>
